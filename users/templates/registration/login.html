{% extends 'charge_amendements/base.html' %}
{% block content %}
  <div class="form-card">
    <h2>Connexion</h2>
    {% if form.errors %}
      <p style="color:red;">Nom d'utilisateur ou mot de passe incorrect.</p>
    {% endif %}
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit">Se connecter</button>
    </form>
  </div>
{% endblock %}
