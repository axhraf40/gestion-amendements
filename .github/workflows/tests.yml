name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install LibreOffice (Word → HTML conversion)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-writer fonts-noto-core
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Django checks
        env:
          DJANGO_DEBUG: "True"
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
      - name: Run tests
        env:
          DJANGO_DEBUG: "True"
          AI_PROVIDER: "none"   # the AI is mocked in the tests; no key is used in CI
        run: python manage.py test
