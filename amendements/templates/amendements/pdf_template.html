<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Extrait Amendement PDF</title>
    <style>
        @page { size: A4 landscape; }
        body { font-family: Arial, 'DejaVu Sans', sans-serif; font-size: 14px; }
        h2 { text-align: center; margin-bottom: 1.5em; }
        .contenu-extrait { border: 1.5px solid #333; padding: 1em; background: #fff; min-height: 200px; }
        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: auto;
            direction: rtl;
            background: #fff;
            margin-bottom: 16px;
            margin-top: 8px;
        }
        th, td {
            border: 2px solid #333 !important;
            padding: 8px 6px;
            vertical-align: top;
            text-align: right;
            direction: rtl;
            word-break: break-all;
            overflow-wrap: break-word;
            white-space: pre-line;
            font-size: 1em;
        }
        th {
            background: #f3f6fa;
            font-weight: bold;
            text-align: center;
        }
        tr {
            height: 1.7em;
        }
        u { text-decoration: underline; }
        s, del { text-decoration: line-through; }
        strong, b { font-weight: bold; }
        em, i { font-style: italic; }
        span.red { color: #ff0000; }
        span.blue { color: #0000ff; }
        span.green { color: #008000; }
        span.orange { color: #FFA500; }
        span.purple { color: #800080; }
        span.yellow { color: #FFFF00; }
        div[style*="text-align:center"], p[style*="text-align:center"] {
            text-align: center !important;
            margin-left: auto;
            margin-right: auto;
        }
        [dir="rtl"] { direction: rtl; text-align: right; }
        table, table * {
            font-size: 1em;
        }
    </style>
</head>
<body>
    <h2>Extrait du fichier : {{ fichier.fichier.name|cut:'amendements_uploads/' }}</h2>
    <div class="contenu-extrait">
        {{ extracted_content|safe }}
    </div>
    <p>
      <span class="red">Texte rouge (classe)</span>
      <span style="color:blue">Texte bleu (inline)</span>
      <span class="green">Texte vert (classe)</span>
    </p>
</body>
</html>
