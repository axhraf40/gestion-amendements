{% extends 'charge_amendements/base.html' %}
{% block content %}
  <h2>Modifier le fichier d'amendement</h2>
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Enregistrer</button>
    <a href="{% url 'fichiers_amendements' %}">Annuler</a>
  </form>
  <p>Fichier actuel : <a href="{{ fichier.fichier.url }}">{{ fichier.fichier.name|cut:'amendements_uploads/' }}</a></p>
{% endblock %}
